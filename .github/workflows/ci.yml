# =============================================================================
# CI Workflow - HogarIA
# =============================================================================
# Presupuesto: ningun job por encima de 5 minutos. Para eso la instalacion y las
# dependencias pesadas (node_modules, navegadores de Playwright) se producen UNA
# vez en el job `install` y se reparten por cache al resto de nodos, y la suite
# e2e se parte en shards que corren en paralelo.
#
# Ojo al editar este fichero: un `- name: Texto (con: dos puntos)` sin comillas
# invalida el YAML y GitHub no crea NINGUN check en el PR (solo un run de 0s con
# el path del workflow como nombre). Antes de subir: make ci:yaml
# =============================================================================

name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.15.0'
  # Clave de las caches, compartida por todos los jobs: depende del lockfile y
  # del run, asi que nunca se reutiliza una cache de otro commit y no se envenena
  # la de los siguientes runs (salvo por restore-keys, que es intentional).
  CACHE_PREFIX: deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # --- Un nodo instala; los demas consumen cache ---
  install:
    name: Install & warm caches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Los navegadores se descargan aqui y no en cada shard: `--with-deps`
      # tambien deja los paquetes de sistema, que el runner hereda.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Save node_modules
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-nm
          path: |
            node_modules
            frontend/node_modules
            server/node_modules

      - name: Save Playwright browsers
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-pw
          path: ~/.cache/ms-playwright

  # --- Type check ---
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-nm
          path: |
            node_modules
            frontend/node_modules
            server/node_modules

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (only if the cache missed)
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Server type check (tsc --noEmit)
        run: pnpm --filter @hogaria/server exec tsc --noEmit

      - name: Frontend build (type-checks templates)
        run: pnpm --filter @hogaria/web run build

  # --- Server unit tests + cobertura ---
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-nm
          path: |
            node_modules
            frontend/node_modules
            server/node_modules

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (only if the cache missed)
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: 'Run server tests (coverage gate 70 % per file, spec 11c)'
        run: pnpm --filter @hogaria/server run test:coverage

      # El informe subido es el HTML de istanbul: se descarga y se abre en el
      # navegador; asi la cobertura se ve, no solo se aprueba.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14

  # --- Production build ---
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [install, test-server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-nm
          path: |
            node_modules
            frontend/node_modules
            server/node_modules

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (only if the cache missed)
        if: steps.nm.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @hogaria/web run build:prod

      - name: Build server
        run: pnpm --filter @hogaria/server run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            frontend/dist/
            server/dist/
          retention-days: 3

  # --- Playwright E2E, partido en shards ---
  # Cada shard levanta su propio par frontend+backend (webServer de Playwright),
  # por eso se puede partir sin coordination: no comparten servidor ni datos, cada
  # prueba registra su propio usuario. `E2E_SEED` lleva el numero de shard para
  # que los correos de dos shards no puedan colisionar nunca.
  e2e:
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_SEED: r${{ github.run_id }}a${{ github.run_attempt }}s${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore node_modules
        id: nm
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-nm
          path: |
            node_modules
            frontend/node_modules
            server/node_modules

      - name: Restore Playwright browsers
        id: pw
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_PREFIX }}-pw
          path: ~/.cache/ms-playwright

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'Install what the cache could not bring (cache miss only)'
        if: steps.nm.outputs.cache-hit != 'true' || steps.pw.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.nm.outputs.cache-hit }}" != "true" ]; then pnpm install --frozen-lockfile; fi
          if [ "${{ steps.pw.outputs.cache-hit }}" != "true" ]; then pnpm exec playwright install --with-deps chromium; fi

      - name: Run Playwright tests (webServer config boots frontend + backend)
        run: >-
          pnpm exec playwright test --project=chromium
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --forbid-only
        env:
          CI: 'true'

      - name: Publish E2E failures as annotations
        if: failure()
        run: node scripts/ci-e2e-summary.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload the run data (seed, durations, failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hogaria-run-${{ matrix.shard }}
          path: |
            test-results/hogaria-run.json
            test-results/junit.xml
          retention-days: 14
          if-no-files-found: ignore
