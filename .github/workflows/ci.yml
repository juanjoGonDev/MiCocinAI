# =============================================================================
# CI Workflow - MiCocinAI
# =============================================================================
# Runs on all PRs and pushes to master/main. pnpm is installed via
# pnpm/action-setup with a version string compatible with packageManager.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Type check ---
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Server type check (tsc --noEmit)
        run: pnpm --filter @hogaria/server exec tsc --noEmit

      - name: Frontend build (type-checks templates)
        run: pnpm --filter @hogaria/web run build

  # --- Server unit tests ---
  test-server:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server tests (coverage gate: 70 % per file, spec §11c)
        run: pnpm --filter @hogaria/server run test:coverage

      # El informe subido es el HTML de istanbul: se descarga y se abre en el
      # navegador; asi la cobertura se ve, no solo se aprueba.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 14

  # --- Production build ---
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, test-server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend (prod)
        run: pnpm --filter @hogaria/web run build:prod

      - name: Build server
        run: pnpm --filter @hogaria/server run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            frontend/dist/
            server/dist/
          retention-days: 3

  # --- Playwright E2E ---
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests (webServer config boots frontend + backend)
        run: pnpm exec playwright test --project=chromium
        env:
          CI: 'true'

      - name: Publish E2E failures as annotations
        if: failure()
        run: node scripts/ci-e2e-summary.mjs

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
